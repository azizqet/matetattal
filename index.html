<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ماتعطل</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
#mapov{position:fixed;inset:0;background:#fff;z-index:20;display:flex;flex-direction:column}#mapov #mp{flex:1;min-height:0}#mapov .bar{padding:12px;display:flex;gap:8px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
:root{--red:#C8102E;--bg:#FFFFFF;--card:#F7F7F7;--tx:#202020;--mut:#6E6E6E;--line:#ECECEC;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:'Tajawal',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;-webkit-tap-highlight-color:transparent}
body{max-width:480px;margin:0 auto;min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
button,input,select{font:inherit;color:inherit}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 6px}
.logo{font-weight:800;font-size:26px;color:var(--red);letter-spacing:-.5px}
.pill{display:flex;align-items:center;gap:6px;background:var(--card);border:0;border-radius:20px;padding:8px 14px;font-size:14px;font-weight:500}
main{padding:8px 18px 20px;animation:in .22s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){main{animation:none}}
h1{font-size:22px;margin:10px 0 4px;font-weight:800}
h2{font-size:17px;margin:18px 0 10px;font-weight:700}
p.s{color:var(--mut);margin:0 0 14px;font-size:14px;line-height:1.7}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.svc{display:flex;align-items:center;gap:14px;padding:14px;margin-bottom:10px;width:100%;text-align:right;cursor:pointer}
.ic{flex:none;width:46px;height:46px;border-radius:14px;background:#FCEBEE;display:grid;place-items:center}
.ic svg{width:24px;height:24px;stroke:var(--red);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.svc b{display:block;font-size:16px}.svc span{font-size:13px;color:var(--mut)}
.svc .ch{margin-inline-start:auto;color:#bbb;font-size:20px}
.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:700;font-size:15px;cursor:pointer;background:var(--red);color:#fff;text-align:center;text-decoration:none;display:inline-block}
.btn.g{background:var(--card);color:var(--tx)}.btn.w{background:#1FA855}.btn.sm{padding:9px 12px;font-size:13px;border-radius:11px}
.btn.full{width:100%}
.row{display:flex;gap:8px}.row>*{flex:1}
.co{padding:14px;margin-bottom:12px;cursor:pointer}
.co h3{margin:0 0 2px;font-size:16px}
.meta{font-size:13px;color:var(--mut);margin-bottom:10px}
.logo-c{width:48px;height:48px;border-radius:14px;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:800;font-size:20px;flex:none}
.tag{display:inline-block;background:var(--card);border-radius:8px;padding:3px 9px;font-size:12px;margin:0 0 0 6px;color:var(--mut)}
.tag.red{background:#FCEBEE;color:var(--red)}
.back{background:none;border:0;color:var(--red);font-weight:700;font-size:15px;padding:6px 0;cursor:pointer}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 5px}
input,select{width:100%;background:var(--card);border:1px solid transparent;border-radius:12px;padding:12px;font-size:15px}
input:focus,select:focus{outline:2px solid var(--red);background:#fff}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid var(--line);display:flex;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;border:0;display:grid;justify-items:center;gap:3px;font-size:12px;color:#9a9a9a;padding:4px;cursor:pointer}
nav button.on{color:var(--red);font-weight:700}
nav svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.stat{display:flex;gap:14px;font-size:13px;color:var(--mut);margin-top:8px}
.note{background:#FFF6E5;border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.7;margin-bottom:12px}
.empty{text-align:center;color:var(--mut);padding:36px 10px;line-height:1.8}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:#202020;color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;max-width:88%;text-align:center;z-index:9}
.ad{padding:12px;margin-bottom:10px}.ad .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mini{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
</style>
</head>

<script>
const I={

const AR={all:[0,0],'العاصمة':[29.37,47.98],'حولي':[29.33,48.03],'السالمية':[29.34,48.07],'الفروانية':[29.28,47.96],'الجهراء':[29.35,47.67],'الأحمدي':[29.08,48.08],'الفحيحيل':[29.08,48.13],'مبارك الكبير':[29.21,48.06]};

// ===== Supabase: المفتاح العام (publishable) فقط. لا تضع service_role أو secret هنا أبداً =====
const SUPABASE_URL='https://xpnwhvbxordtsmnegvri.supabase.co';
const SUPABASE_KEY='sb_publishable_n7zs9ZZSp98MURnnpu3UAw_-OhKNHH9';
const day=n=>new Date(Date.now()+n*864e5).toISOString().slice(0,10);

let area='all';try{area=localStorage.getItem(KEY+'a')||'all'}catch(_){}

let POS=null;try{const q=localStorage.getItem(KEY+'p');if(q){const[a,b]=q.split(',').map(Number);if(isFinite(a)&&isFinite(b))POS={lat:a,lng:b}}}catch(_){}
const savePos=()=>{try{localStorage.setItem(KEY+'p',POS.lat+','+POS.lng)}catch(_){}};
const nearestArea=(la,ln)=>{let b=null,bd=1e9;AN.forEach(a=>{const d=(AR[a][0]-la)**2+(AR[a][1]-ln)**2;if(d<bd){bd=d;b=a}});return b};
let V={v:'home'},C=[],LOAD={s:'loading',m:''},AREAS={},busy=false,sending=false;
let SES=null;try{SES=JSON.parse(sessionStorage.getItem(KEY+'s'))}catch(_){}
let ADM={req:[],cos:[],loaded:false,loading:false,err:''};
const e=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const vis=c=>c.on&&c.end>=today();
const inArea=c=>area==='all'||c.ar.includes(area);
const svcName=id=>(SV.find(s=>s.id===id)||{}).n||'';
const intl=p=>{p=String(p||'').replace(/\D/g,'');return p.length===8?'965'+p:p};
function toast(t){const o=document.createElement('div');o.className='toast';o.textContent=t;document.body.appendChild(o);setTimeout(()=>o.remove(),3200)}

async function sb(path,o={}){
const h={apikey:SUPABASE_KEY};
if(o.token)h.Authorization='Bearer '+o.token;else if(!path.startsWith('/auth/'))h.Authorization='Bearer '+SUPABASE_KEY;
if(o.body!==undefined)h['Content-Type']='application/json';
if(o.prefer)h.Prefer=o.prefer;
let r;
try{r=await fetch(SUPABASE_URL+path,{method:o.method||'GET',headers:h,body:o.body===undefined?undefined:JSON.stringify(o.body)})}
catch(_){const x=new Error('تعذر الاتصال. تأكد من الإنترنت');x.net=true;throw x}
const t=await r.text();let j=null;try{j=t?JSON.parse(t):null}catch(_){}
if(!r.ok){const m=(j&&(j.message||j.error_description||j.msg||j.hint))||t||'';const x=new Error('HTTP '+r.status+(m?' - '+m:''));x.status=r.status;throw x}
return j}

const SEL0='id,service_id,name,phone,whatsapp,price_text,rating,sub_end,is_active,is_sample,company_areas(areas(name_ar))';let SEL=SEL0.replace('is_sample,','is_sample,logo_url,');
const cosQ=async o=>{try{return await sb('/rest/v1/companies?select='+SEL+'&order=id.desc',o)}catch(x){if(SEL!==SEL0&&/logo_url/.test(x.message||'')){SEL=SEL0;return sb('/rest/v1/companies?select='+SEL+'&order=id.desc',o)}throw x}};
function shrink(file,max=600){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error('تعذر تجهيز الصورة')),'image/jpeg',0.85)};im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('هذا الملف مو صورة صالحة'))};im.src=u})}
async function upLogo(blob,path,token){const h={apikey:SUPABASE_KEY,'Content-Type':'image/jpeg','cache-control':'max-age=31536000'};if(token)h.Authorization='Bearer '+token;
let r;try{r=await fetch(SUPABASE_URL+'/storage/v1/object/logos/'+path,{method:'POST',headers:h,body:blob})}catch(_){throw new Error('تعذر الاتصال. تأكد من الإنترنت')}
if(!r.ok){let m='';try{const j=await r.json();m=j.message||j.error||''}catch(_){}throw new Error('HTTP '+r.status+(m?' - '+m:''))}
return SUPABASE_URL+'/storage/v1/object/public/logos/'+path}
const rnd=()=>Date.now()+'-'+Math.random().toString(36).slice(2,8);
function prevLogo(i,id){const d=document.getElementById(id);if(!d)return;const f=i.files&&i.files[0];d.innerHTML='';if(!f)return;const im=document.createElement('img');im.src=URL.createObjectURL(f);im.style.cssText='width:64px;height:64px;border-radius:14px;object-fit:cover;margin-top:8px';d.appendChild(im)}
const av=(c,st)=>c.lg?`<img class="logo-c" alt="" src="${e(c.lg)}" style="object-fit:cover;${st||'flex:none;max-width:48px'}">`:`<div class="logo-c" style="${st||'flex:none;max-width:48px'}">${e(c.n[0])}</div>`;
const mapCo=r=>({id:r.id,s:r.service_id,n:r.name,p:r.price_text||'اتصل للسعر',ar:(r.company_areas||[]).map(x=>x.areas&&x.areas.name_ar).filter(Boolean),call:r.phone||r.whatsapp,ph:r.whatsapp||r.phone,r:Number(r.rating)||0,end:r.sub_end,on:r.is_active,smp:r.is_sample,lg:r.logo_url||''});
async function loadPublic(){
LOAD={s:'loading',m:''};if(['home','list','co'].includes(V.v))render();
try{const [cs,ars]=await Promise.all([cosQ(),sb('/rest/v1/areas?select=id,name_ar')]);
C=(cs||[]).map(mapCo);AREAS={};(ars||[]).forEach(a=>{AREAS[a.name_ar]=a.id});LOAD={s:'ok',m:''}}
catch(err){console.error(err);LOAD={s:'err',m:err.message}}
if(['home','list','co'].includes(V.v))render()}

function setSes(s){SES=s;try{s?sessionStorage.setItem(KEY+'s',JSON.stringify(s)):sessionStorage.removeItem(KEY+'s')}catch(_){}}
const mkSes=j=>({at:j.access_token,rt:j.refresh_token,exp:Date.now()+(j.expires_in||3600)*1000,email:(j.user&&j.user.email)||''});
async function login(){
const em=le.value.trim(),pw=lp.value;if(!em||!pw)return toast('اكتب الإيميل وكلمة السر');
const b=document.getElementById('lb');b.disabled=true;b.textContent='جاري الدخول...';
try{const j=await sb('/auth/v1/token?grant_type=password',{method:'POST',body:{email:em,password:pw}});setSes(mkSes(j));ADM={req:[],cos:[],loaded:false,loading:false,err:''};render();await loadAdmin()}

async function token(){
if(!SES)throw new Error('سجّل الدخول أولاً');
if(Date.now()>SES.exp-60000){try{const j=await sb('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:{refresh_token:SES.rt}});setSes(mkSes(j))}
catch(_){setSes(null);ADM={req:[],cos:[],loaded:false,loading:false,err:''};render();throw new Error('انتهت الجلسة. سجّل الدخول من جديد')}}
return SES.at}
function logout(){setSes(null);ADM={req:[],cos:[],loaded:false,loading:false,err:''};toast('تم تسجيل الخروج');render()}

ADM.loading=true;ADM.err='';if(V.v==='admin')render();
try{const t=await token();
const [rq,cs,ars]=await Promise.all([sb('/rest/v1/join_requests?select=*&order=created_at.desc',{token:t}),cosQ({token:t}),sb('/rest/v1/areas?select=id,name_ar')]);

ADM.req=(rq||[]).filter(x=>x.status==='new');ADM.cos=(cs||[]).map(mapCo);ADM.loaded=true}
catch(err){console.error(err);ADM.err=err.message}
ADM.loading=false;if(V.v==='admin')render()}

async function run(fn,ok){
if(busy)return;busy=true;
try{const t=await token();await fn(t);toast(ok);await loadAdmin();loadPublic()}
catch(err){console.error(err);toast('ما تم: '+err.message)}
busy=false}
const needRows=r=>{if(!r||!r.length)throw new Error('ما تغيّر شي. تأكد إنك داخل بحساب المالك')};
async function insertCo(t,f){
const p=intl(f.phone);
const r=await sb('/rest/v1/companies',{method:'POST',token:t,prefer:'return=representation',body:Object.assign({service_id:f.service,name:f.name,phone:p,whatsapp:p,price_text:f.price||null,is_active:true,is_sample:false,sub_start:today(),sub_end:day(30)},f.logo?{logo_url:f.logo}:{})});
const id=r&&r[0]&&r[0].id;if(!id)throw new Error('ما رجع رقم الشركة من القاعدة');
const aid=AREAS[f.area];
if(aid)await sb('/rest/v1/company_areas',{method:'POST',token:t,prefer:'return=minimal',body:{company_id:id,area_id:aid}})}
const patch=(t,table,id,body)=>sb('/rest/v1/'+table+'?id=eq.'+id,{method:'PATCH',token:t,prefer:'return=representation',body}).then(needRows);
const accept=id=>run(async t=>{const q=ADM.req.find(x=>x.id===id);if(!q)throw new Error('الطلب غير موجود');
await insertCo(t,{name:q.company_name,service:q.service_id,phone:q.phone,price:'',area:q.area_name,logo:q.logo_url||''});
await patch(t,'join_requests',id,{status:'accepted'})},'تمت إضافة الشركة باشتراك 30 يوم');
const saveEdit=id=>run(async t=>{const n=edn.value.trim(),ph=intl(edph.value);if(n.length<2)throw new Error('اكتب اسم الشركة');if(ph.length<8)throw new Error('اكتب رقم هاتف صحيح');
const b={name:n,price_text:edp.value.trim()||null,phone:ph,whatsapp:ph};const f=edl.files&&edl.files[0];
if(f)b.logo_url=await upLogo(await shrink(f),'companies/'+id+'-'+rnd()+'.jpg',t);
await patch(t,'companies',id,b);ADM.edit=null},'تم حفظ التعديل');
const rejReq=id=>run(t=>patch(t,'join_requests',id,{status:'rejected'}),'تم رفض الطلب');
const tog=id=>run(t=>{const c=ADM.cos.find(x=>x.id===id);return patch(t,'companies',id,{is_active:!c.on})},'تم التحديث');
const ext=id=>run(t=>{const c=ADM.cos.find(x=>x.id===id);const b=c.end<today()?today():c.end;
return patch(t,'companies',id,{sub_end:new Date(new Date(b).getTime()+30*864e5).toISOString().slice(0,10)})},'تم تمديد الاشتراك 30 يوم');
const del=id=>{if(confirm('تأكد من حذف الشركة؟'))run(async t=>needRows(await sb('/rest/v1/companies?id=eq.'+id,{method:'DELETE',token:t,prefer:'return=representation'})),'تم حذف الشركة')};
function addCo(){const n=an.value.trim(),p=ap.value.replace(/\D/g,'');
if(n.length<2)return toast('اكتب اسم الشركة');if(p.length<8)return toast('اكتب رقم هاتف صحيح');
run(t=>insertCo(t,{name:n,service:as.value,phone:p,price:apr.value.trim(),area:aa.value}),'تمت إضافة الشركة باشتراك 30 يوم')}

function go(v,x){V=Object.assign({v},x||{});render();scrollTo(0,0);if(v==='admin'&&SES&&!ADM.loaded&&!ADM.loading)loadAdmin()}

function openMap(){
if(typeof L==='undefined')return toast('الخريطة ما تحمّلت. تأكد من الإنترنت وحاول مرة ثانية');
V.sel=false;const o=document.createElement('div');o.id='mapov';o.dir='ltr';
o.innerHTML='<div style="padding:12px 14px;font-weight:700;direction:rtl;text-align:right">اضغط على الخريطة أو اسحب الدبوس لمكانك</div><div id="mp"></div><div class="bar"><button class="btn g" style="flex:1" id="mcan">إلغاء</button><button class="btn g" style="flex:1" id="mgps">موقعي</button><button class="btn" style="flex:2" id="mok">تأكيد</button></div>';
document.body.appendChild(o);
const c0=POS?[POS.lat,POS.lng]:[29.3759,47.9774];
const m=L.map('mp').setView(c0,POS?16:11);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(m);
let mk=POS?L.marker(c0,{draggable:true}).addTo(m):null;
const put=ll=>{if(mk)mk.setLatLng(ll);else mk=L.marker(ll,{draggable:true}).addTo(m)};
m.on('click',ev=>put(ev.latlng));
setTimeout(()=>m.invalidateSize(),60);
document.getElementById('mcan').onclick=()=>{m.remove();o.remove()};
document.getElementById('mgps').onclick=()=>{if(!navigator.geolocation)return toast('جهازك ما يدعم تحديد الموقع');navigator.geolocation.getCurrentPosition(p=>{const ll=L.latLng(p.coords.latitude,p.coords.longitude);put(ll);m.setView(ll,17)},()=>toast('ما قدرنا نحدد موقعك. اضغط على الخريطة يدوياً'),{timeout:8000})};
document.getElementById('mok').onclick=()=>{if(!mk)return toast('اضغط على الخريطة أولاً لتحديد مكانك');const ll=mk.getLatLng();POS={lat:ll.lat,lng:ll.lng};savePos();m.remove();o.remove();const b=nearestArea(POS.lat,POS.lng);setArea(b);toast('تم حفظ موقعك. أقرب منطقة: '+b)}}
function locate(q){if(!navigator.geolocation)return q||toast('جهازك ما يدعم تحديد الموقع');
navigator.geolocation.getCurrentPosition(p=>{POS={lat:p.coords.latitude,lng:p.coords.longitude};savePos();const b=nearestArea(POS.lat,POS.lng);setArea(b);toast('تم تحديد منطقتك: '+b)},()=>{if(!q)toast('ما قدرنا نحدد موقعك. فعّل الموقع للمتصفح أو اختر منطقتك يدوياً')},{timeout:8000})}
function act(id,t){const c=C.find(x=>x.id===id);if(!c)return;
if(c.smp)return toast('هذي بيانات تجريبية. الاتصال يشتغل مع الشركات الحقيقية');
location.href=t==='c'?'tel:+'+intl(c.call):'https://wa.me/'+intl(c.ph)+(POS?'?text='+encodeURIComponent('السلام عليكم، أحتاج خدمة. موقعي: https://maps.google.com/?q='+POS.lat.toFixed(6)+','+POS.lng.toFixed(6)):'')}
const rate=c=>c.r>0?'★ '+c.r.toFixed(1):'جديد';
function companyCard(c){return `<div class="card co" onclick="go('co',{id:${c.id}})"><div class="row" style="align-items:center;gap:12px">${av(c)}<div style="flex:1"><h3>${e(c.n)}</h3><div class="meta">${rate(c)} <span class="tag red">${e(c.p)}</span></div></div></div>${c.smp?'<span class="tag">بيانات تجريبية</span>':''}
<div class="row" style="margin-top:10px" onclick="event.stopPropagation()"><button class="btn sm" onclick="act(${c.id},'c')">اتصال</button><button class="btn sm w" onclick="act(${c.id},'w')">واتساب</button></div></div>`}
function home(){return `<h1>وش تحتاج لسيارتك؟</h1><p class="s">اختر الخدمة وتواصل مع الشركة مباشرة. بدون تسجيل.</p>
<button class="btn g full" style="margin-bottom:14px" onclick="locate()">حدد موقعي</button>
<button class="btn g full" style="margin-bottom:14px" onclick="openMap()">حدد موقعك بالضبط على الخريطة</button>
${SV.map(s=>`<button class="card svc" onclick="go('list',{svc:'${s.id}'})"><span class="ic">${svg(s.i)}</span><span><b>${s.n}</b><span>${s.d}</span></span><span class="ch">‹</span></button>`).join('')}`}
function list(){
let body;
if(LOAD.s==='loading')body='<div class="empty">جاري التحميل...</div>';
else if(LOAD.s==='err')body=`<div class="empty">ما قدرنا نجيب الشركات.<br>${e(LOAD.m)}<br><br><button class="btn" onclick="loadPublic()">إعادة المحاولة</button></div>`;
else{const all=C.filter(c=>c.s===V.svc&&vis(c)),near=all.filter(inArea),far=area==='all'?[]:all.filter(c=>!inArea(c));
body=near.map(companyCard).join('');
if(!near.length&&area!=='all')body='<div class="empty">ما فيه شركات بمنطقتك ('+area+') حالياً.</div>';
if(far.length)body+='<h2 style="margin:16px 0 8px">شركات في مناطق ثانية</h2>'+far.map(companyCard).join('');
if(!all.length)body='<div class="empty">ما فيه شركات في هالخدمة حالياً.</div>'}
return `<button class="back" onclick="go('home')">› رجوع</button><h1>${svcName(V.svc)}</h1><p class="s">${area==='all'?'كل مناطق الكويت':'منطقة '+area}</p><button class="btn g full" style="margin-bottom:14px" onclick="locate()">حدد موقعي (الأقرب لك)</button><button class="btn g full" style="margin-bottom:14px" onclick="openMap()">حدد موقعك بالضبط على الخريطة</button>${body}`}
function co(){const c=C.find(x=>x.id===V.id);
if(!c)return `<button class="back" onclick="go('home')">› رجوع</button><div class="empty">ما لقينا هالشركة.</div>`;
return `<button class="back" onclick="go('list',{svc:'${c.s}'})">› رجوع</button>
<div class="card" style="padding:18px;text-align:center">${av(c,'margin:0 auto 10px;width:64px;height:64px;font-size:28px')}<h1 style="margin:0">${e(c.n)}</h1><div class="meta">${rate(c)} · ${svcName(c.s)}</div>${c.smp?'<span class="tag">بيانات تجريبية</span>':''}</div>
<h2>الأسعار</h2><div class="card" style="padding:14px">${e(c.p)}</div>
<h2>المناطق</h2><div>${c.ar.map(a=>`<span class="tag red" style="margin-bottom:6px">${e(a)}</span>`).join('')}</div>
<h2>الصور</h2><div class="row"><div style="height:90px;border-radius:14px;background:var(--card)"></div><div style="height:90px;border-radius:14px;background:var(--card)"></div></div>
<p class="s" style="margin-top:6px">الدفع يكون مباشرة بينك وبين الشركة.</p>
<div class="row" style="margin-top:10px"><button class="btn" onclick="act(${c.id},'c')">اتصال</button><button class="btn w" onclick="act(${c.id},'w')">واتساب</button></div>`}
function join(){return `<h1>انضم كشركة</h1><p class="s">قدّم طلبك وبنتواصل معك لتفعيل اشتراكك.</p>
<label>اسم الشركة</label><input id="jn"><label>نوع الخدمة</label><select id="js">${SV.map(s=>`<option value="${s.id}">${s.n}</option>`).join('')}</select>
<label>رقم الهاتف</label><input id="jp" inputmode="tel" placeholder="965xxxxxxxx"><label>المنطقة الرئيسية</label><select id="ja">${AN.map(a=>`<option>${a}</option>`).join('')}</select>
<label>شعار الشركة (اختياري)</label><input id="jl" type="file" accept="image/*" onchange="prevLogo(this,'jlp')"><div id="jlp"></div>
<button class="btn full" style="margin-top:18px" onclick="sendJoin()">أرسل الطلب</button>`}
async function sendJoin(){
if(sending)return;
const n=jn.value.trim(),p=jp.value.replace(/\D/g,''),s=js.value,a=ja.value;
if(n.length<2||n.length>100)return toast('اسم الشركة لازم يكون بين 2 و100 حرف');
if(p.length<8||p.length>20)return toast('اكتب رقم هاتف صحيح (8 أرقام أو أكثر)');
const btn=document.querySelector('button[onclick="sendJoin()"]');sending=true;if(btn){btn.disabled=true;btn.textContent='جاري الإرسال...'}
try{let logo=null;const lf=jl.files&&jl.files[0];
if(lf){if(btn)btn.textContent='جاري رفع الشعار...';logo=await upLogo(await shrink(lf),'pending/'+rnd()+'.jpg')}
if(btn)btn.textContent='جاري الإرسال...';
await sb('/rest/v1/join_requests',{method:'POST',prefer:'return=minimal',body:Object.assign({company_name:n,service_id:s,phone:p,area_name:a,status:'new'},logo?{logo_url:logo}:{})});
toast('وصل طلبك. شكراً لك');go('home')}
catch(err){console.error('join_requests insert failed',err);toast('ما انحفظ الطلب: '+err.message)}
finally{sending=false;const b=document.querySelector('button[onclick="sendJoin()"]');if(b){b.disabled=false;b.textContent='أرسل الطلب'}}}
function admin(){
if(!SES)return `<h1>دخول المالك</h1><p class="s">للمالك فقط. أدخل الإيميل وكلمة السر.</p><label>الإيميل</label><input id="le" type="email" autocomplete="username" inputmode="email"><label>كلمة السر</label><input id="lp" type="password" autocomplete="current-password"><button class="btn full" id="lb" style="margin-top:18px" onclick="login()">دخول</button>`;
if(ADM.loading&&!ADM.loaded)return '<div class="empty">جاري التحميل...</div>';
if(ADM.err&&!ADM.loaded)return `<h1>لوحة المالك</h1><div class="note">${e(ADM.err)}</div><button class="btn full" onclick="loadAdmin()">إعادة المحاولة</button><button class="btn g full" style="margin-top:10px" onclick="logout()">خروج</button>`;
const n=ADM.cos.filter(vis).length;
return `<div style="display:flex;justify-content:space-between;align-items:center"><h1 style="margin:0">لوحة المالك</h1><button class="btn sm g" onclick="logout()">خروج</button></div><p class="s">${e(SES.email)}</p>
<h2>طلبات الانضمام (${ADM.req.length})</h2>${ADM.req.length?ADM.req.map(r=>`<div class="card ad">${r.logo_url?`<img alt="" src="${e(r.logo_url)}" style="width:56px;height:56px;border-radius:12px;object-fit:cover;float:left">`:''}<b>${e(r.company_name)}</b><div class="meta">${svcName(r.service_id)} · ${e(r.area_name||'')} · ${e(r.phone)}</div><div class="row"><button class="btn sm" onclick="accept(${r.id})">قبول وإضافة</button><button class="btn sm g" onclick="rejReq(${r.id})">رفض</button></div></div>`).join(''):'<p class="s">لا توجد طلبات جديدة.</p>'}
<h2>الشركات (${ADM.cos.length}) · الظاهرة ${n}</h2>
${ADM.cos.length?ADM.cos.map(c=>`<div class="card ad"><div class="top"><b>${e(c.n)}</b><span class="tag ${vis(c)?'red':''}">${!c.on?'موقوفة':c.end<today()?'منتهية':'فعّالة'}</span></div>
<div class="meta">${svcName(c.s)} · ينتهي ${e(c.end)}${c.smp?' · تجريبية':''}</div>
<div class="mini"><button class="btn sm g" onclick="tog(${c.id})">${c.on?'إيقاف':'تفعيل'}</button><button class="btn sm g" onclick="ext(${c.id})">تمديد 30 يوم</button><button class="btn sm g" onclick="ADM.edit=ADM.edit===${c.id}?null:${c.id};render()">تعديل</button><button class="btn sm g" onclick="del(${c.id})">حذف</button></div>
${ADM.edit===c.id?`<div style="margin-top:10px"><label>الاسم</label><input id="edn" value="${e(c.n)}"><label>الأسعار</label><input id="edp" value="${e(c.p==='اتصل للسعر'?'':c.p)}"><label>الهاتف</label><input id="edph" inputmode="tel" value="${e(c.call||'')}"><label>الشعار (اختر صورة لتغييره)</label><input id="edl" type="file" accept="image/*" onchange="prevLogo(this,'edlp')"><div id="edlp">${c.lg?`<img alt="" src="${e(c.lg)}" style="width:64px;height:64px;border-radius:14px;object-fit:cover;margin-top:8px">`:''}</div><div class="mini"><button class="btn sm" onclick="saveEdit(${c.id})">حفظ</button><button class="btn sm g" onclick="ADM.edit=null;render()">إلغاء</button></div></div>`:''}</div>`).join(''):'<p class="s">لا توجد شركات بعد.</p>'}
<h2>إضافة شركة</h2><label>الاسم</label><input id="an"><label>الخدمة</label><select id="as">${SV.map(s=>`<option value="${s.id}">${s.n}</option>`).join('')}</select>
<label>الهاتف</label><input id="ap" inputmode="tel"><label>الأسعار</label><input id="apr"><label>المنطقة</label><select id="aa">${AN.map(a=>`<option>${a}</option>`).join('')}</select>
<button class="btn full" style="margin-top:14px" onclick="addCo()">إضافة (اشتراك 30 يوم)</button>`}
function render(){const t=V.v;
document.getElementById('areaBtn').innerHTML=svg('pin').replace('<svg','<svg style="width:16px;height:16px;stroke:var(--red);fill:none;stroke-width:2"')+(area==='all'?'كل الكويت':area);
let h=t==='home'?home():t==='list'?list():t==='co'?co():t==='join'?join():admin();
if(V.sel)h=`<div class="card" style="padding:12px;margin-bottom:12px"><b>اختر المنطقة</b><button class="btn full" style="margin-top:10px" onclick="locate()">حدد موقعي تلقائياً</button><button class="btn g full" style="margin-top:8px" onclick="openMap()">حدد على الخريطة</button><div class="mini"><button class="btn sm ${area==='all'?'':'g'}" onclick="setArea('all')">كل الكويت</button>${AN.map(a=>`<button class="btn sm ${area===a?'':'g'}" onclick="setArea('${a}')">${a}</button>`).join('')}</div></div>`+h;
document.getElementById('app').innerHTML=h;
const tabs=[['home','الرئيسية','home'],['join','انضم كشركة','join'],['admin','الإدارة','admin']];const cur=(t==='list'||t==='co')?'home':t;
document.getElementById('nav').innerHTML=tabs.map(x=>`<button class="${cur===x[0]?'on':''}" onclick="go('${x[0]}')">${svg(x[2])}${x[1]}</button>`).join('')}
render();loadPublic();
if(area==='all')locate(true);
</script>
</body>
</html>

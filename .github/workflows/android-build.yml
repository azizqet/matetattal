# بناء Android عبر EAS (نسخة تجربة APK داخلية — لا يرفع لـ Google Play ولا ينشر)
# أول تشغيل ينشئ مفتاح التوقيع (Keystore) تلقائياً على خوادم Expo ويحفظه في حسابك.
# التشغيل: أضف الوسم "android-build" إلى الـ Pull Request، أو Run workflow (بعد الدمج في main).
# المتطلب: سر EXPO_TOKEN في إعدادات المستودع.
name: Android Build (EAS)

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile'
        type: choice
        options: [preview, production]
        default: preview

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'android-build'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Require EXPO_TOKEN
        working-directory: .
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::أضف سر EXPO_TOKEN في Settings → Secrets → Actions ثم أعد التشغيل."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Link Expo project (creates it on first run)
        run: eas init --non-interactive --force
      - name: Start EAS build (Android)
        run: |
          eas build --platform android --profile "${{ inputs.profile || 'preview' }}" \
            --non-interactive --no-wait --json > build.json
          cat build.json
          URL=$(node -e 'const b=require("./build.json");const x=Array.isArray(b)?b[0]:b;console.log(`https://expo.dev/accounts/${x.project.ownerAccount.name}/projects/${x.project.slug}/builds/${x.id}`)')
          echo "### 🛠️ بدأ بناء Android" >> $GITHUB_STEP_SUMMARY
          echo "تابع البناء وحمّل ملف APK من: $URL" >> $GITHUB_STEP_SUMMARY

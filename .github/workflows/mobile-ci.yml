name: Mobile CI

on:
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile-ci.yml']
  push:
    branches: [main]
    paths: ['mobile/**']

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npx expo lint
      - name: Unit tests
        run: npx jest --ci
      - name: Expo doctor
        run: npx --yes expo-doctor
      - name: Web export (bundle builds)
        run: npx expo export --platform web

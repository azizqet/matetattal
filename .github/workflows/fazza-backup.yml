name: FAZZA nightly database backup
on:
  schedule: [{ cron: "17 23 * * *" }]   # 02:17 Kuwait time
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - name: Encrypted dump (roles, schema, data)
        working-directory: fazza
        env:
          SUPABASE_DB_URL: ${{ secrets.FAZZA_SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.FAZZA_BACKUP_PASSPHRASE }}
          BACKUP_DIR: ${{ runner.temp }}/backups
        run: ./scripts/backup/backup.sh
      - uses: actions/upload-artifact@v4
        with:
          name: fazza-db-${{ github.run_id }}
          path: ${{ runner.temp }}/backups/*.tar.enc
          retention-days: 30
